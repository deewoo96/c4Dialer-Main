workflows:
  ios-release:
    name: iOS Release Workflow
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: "Codemagic vivek"   # <-- Match the name of your key in Codemagic settings here
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing settings
        script: |
          app-store-connect fetch-signing-files "metal.hughes.tata_smart_metal_dialer" --type IOS_DISTRIBUTION
      - name: Build ipa for release
        script: |
          flutter build ipa --release --build-number=53
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true