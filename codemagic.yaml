workflows:
  ios-release:
    name: iOS Release Workflow
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing settings
        script: |
          # Codemagic automatic code signing via App Store Connect API
          app-store-connect fetch-signing-files "metal.hughes.tatasmartmetaldialer.c4dialerV2" --type IOS_DISTRIBUTION
      - name: Build ipa for release
        script: |
          flutter build ipa --release --build-number=53
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration  # Uses the App Store Connect API integration you linked in Codemagic settings
        submit_to_testflight: false
        #, expire_build_pre_check_in: false