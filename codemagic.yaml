workflows:
  ios-release:
    name: iOS Release Workflow
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: metal.hughes.tatasmartmetaldialer.c4dialerV2
    integrations:
      app_store_connect: "Codemagic vivek"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing files
        script: |
          app-store-connect fetch-signing-files "metal.hughes.tatasmartmetaldialer.c4dialerV2" --type IOS_APP_STORE --create
      - name: Build ipa for release
        script: |
          flutter build ipa --release --build-number=53
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true